<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 600" width="100%" role="img">
  <title>四款产品概念手绘草图</title>
  <desc>越野车玩具、单反相机、智能猫窝、头戴耳机的 Excalidraw 风格手绘线框草图</desc>
  <style>
    .title { font: 500 15px var(--font-sans, system-ui, sans-serif); fill: #444441; }
    .label { font: 500 13px var(--font-sans, system-ui, sans-serif); fill: #5F5E5A; }
    .caption { font: 400 11px var(--font-sans, system-ui, sans-serif); fill: #888780; }
    .panel { fill: #F1EFE8; stroke: #B4B2A9; stroke-width: 0.8; stroke-dasharray: 5 4; }
    .sketch { fill: none; stroke: #444441; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }
    .sketch-light { fill: none; stroke: #5F5E5A; stroke-width: 0.7; stroke-linecap: round; stroke-linejoin: round; }
    .hatch { fill: none; stroke: #888780; stroke-width: 0.5; stroke-linecap: round; }
    .dot { fill: #444441; }
  </style>

  <text x="340" y="32" text-anchor="middle" class="title">concept sketches · 四款产品概念手绘草图</text>

  <!-- panel 1: off-road truck toy -->
  <g>
    <rect x="45" y="52" width="288" height="232" rx="12" class="panel"/>
    <text x="189" y="78" text-anchor="middle" class="label">越野车玩具</text>
    <text x="75" y="95" class="caption">side view</text>

    <!-- truck body -->
    <path class="sketch" d="M105,210 L105,148 L138,148 L138,122 L175,122 L175,148 L268,148 L268,210"/>
    <path class="sketch-light" d="M108,212 L108,151 L141,151 L141,125 L173,125 L173,151 L266,151 L266,212"/>
    <!-- bed/cabin divider -->
    <path class="sketch" d="M175,148 L175,210"/>
    <!-- wheels -->
    <circle class="sketch" cx="135" cy="210" r="20"/>
    <circle class="sketch" cx="135" cy="210" r="13"/>
    <circle class="sketch" cx="240" cy="210" r="20"/>
    <circle class="sketch" cx="240" cy="210" r="13"/>
    <!-- tread marks -->
    <path class="sketch-light" d="M120,210 L124,215 M135,225 L135,232 M150,210 L146,215"/>
    <path class="sketch-light" d="M225,210 L229,215 M240,225 L240,232 M255,210 L251,215"/>
    <!-- grille -->
    <path class="sketch" d="M258,158 L258,200 M250,158 L250,200 M242,158 L242,200"/>
    <!-- roof light bar -->
    <path class="sketch" d="M140,115 L173,115 M145,112 L145,118 M155,112 L155,118 M165,112 L165,118"/>
    <!-- bumper -->
    <path class="sketch" d="M100,205 L108,205 M265,205 L273,205"/>
    <!-- sketch hatch -->
    <path class="hatch" d="M220,160 L240,180 M225,155 L245,175 M230,150 L250,170"/>
    <!-- dimension arrow -->
    <path class="sketch-light" d="M105,230 L268,230"/>
    <path class="sketch-light" d="M105,226 L105,234 M268,226 L268,234"/>
    <text x="186" y="244" text-anchor="middle" class="caption">1:18 scale concept</text>
  </g>

  <!-- panel 2: DSLR camera -->
  <g>
    <rect x="347" y="52" width="288" height="232" rx="12" class="panel"/>
    <text x="491" y="78" text-anchor="middle" class="label">单反相机</text>
    <text x="377" y="95" class="caption">iso view</text>

    <!-- body -->
    <path class="sketch" d="M370,172 L370,142 L432,142 L432,128 L458,128 L458,142 L495,142 L495,172 L475,172 L475,182 L450,182 L450,172 Z"/>
    <path class="sketch-light" d="M373,174 L373,145 L435,145 L435,131 L456,131 L456,145 L493,145 L493,174"/>
    <!-- grip -->
    <path class="sketch" d="M495,142 L510,148 L510,172 L495,172"/>
    <!-- lens barrel -->
    <path class="sketch" d="M430,155 L520,150 L520,164 L430,169 Z"/>
    <!-- lens rings -->
    <path class="sketch-light" d="M452,154 L452,170 M472,153 L472,171 M492,152 L492,172"/>
    <!-- lens hood -->
    <path class="sketch" d="M520,150 L545,143 L545,171 L520,164"/>
    <!-- viewfinder -->
    <path class="sketch" d="M400,142 L400,132 L432,132 L432,142"/>
    <!-- buttons -->
    <circle class="dot" cx="442" cy="136" r="2"/>
    <circle class="dot" cx="484" cy="136" r="2"/>
    <!-- flash hotshoe -->
    <path class="sketch" d="M410,128 L422,128"/>
    <!-- sketch hatch -->
    <path class="hatch" d="M380,148 L400,168 M385,143 L405,163"/>
    <!-- annotation -->
    <path class="sketch-light" d="M540,135 L560,120"/>
    <circle class="dot" cx="560" cy="120" r="2"/>
    <text x="565" y="118" class="caption">tele lens</text>
  </g>

  <!-- panel 3: smart cat nest -->
  <g>
    <rect x="45" y="314" width="288" height="232" rx="12" class="panel"/>
    <text x="189" y="340" text-anchor="middle" class="label">智能猫窝</text>
    <text x="75" y="357" class="caption">multi-view</text>

    <!-- main pod body -->
    <path class="sketch" d="M110,490 C110,405 155,385 200,385 C245,385 285,405 285,490"/>
    <path class="sketch" d="M110,490 L285,490"/>
    <!-- dome top -->
    <path class="sketch-light" d="M125,420 C125,380 160,372 200,372 C240,372 270,380 270,420"/>
    <!-- entrance arch -->
    <path class="sketch" d="M165,490 L165,445 C165,425 182,415 200,415 C218,415 230,425 230,445 L230,490"/>
    <!-- interior grid/lines -->
    <path class="sketch-light" d="M175,445 L220,445 M178,455 L217,455 M181,465 L214,465"/>
    <!-- side detail -->
    <path class="sketch" d="M255,435 L275,435 L275,465 L255,465"/>
    <!-- bottom pad -->
    <path class="sketch" d="M140,490 L255,490"/>
    <!-- sketch hatch -->
    <path class="hatch" d="M130,425 L150,445 M135,420 L155,440"/>
    <!-- dimensions -->
    <path class="sketch-light" d="M110,505 L200,505 M110,501 L110,509 L200,501 L200,509"/>
    <text x="155" y="519" text-anchor="middle" class="caption">520 mm</text>
  </g>

  <!-- panel 4: headphones -->
  <g>
    <rect x="347" y="314" width="288" height="232" rx="12" class="panel"/>
    <text x="491" y="340" text-anchor="middle" class="label">头戴耳机</text>
    <text x="377" y="357" class="caption">front view</text>

    <!-- headband -->
    <path class="sketch" d="M415,465 C415,385 455,365 495,365 C535,365 575,385 575,465"/>
    <path class="sketch-light" d="M422,465 C422,390 458,372 495,372 C532,372 568,390 568,465"/>
    <!-- left ear cup -->
    <path class="sketch" d="M410,435 L410,475 C410,488 425,492 440,492 C455,492 465,488 465,475 L465,435"/>
    <!-- right ear cup -->
    <path class="sketch" d="M525,435 L525,475 C525,488 540,492 555,492 C570,492 580,488 580,475 L580,435"/>
    <!-- sliders -->
    <path class="sketch" d="M420,465 L420,445 M570,465 L570,445"/>
    <path class="sketch-light" d="M428,448 L428,462 M562,448 L562,462"/>
    <!-- music note on left cup -->
    <path class="sketch" d="M440,455 L440,475 M440,455 L455,450 L455,470" stroke-width="1"/>
    <!-- cushion lines -->
    <path class="sketch-light" d="M425,478 L450,478 M540,478 L565,478"/>
    <!-- annotation -->
    <path class="sketch-light" d="M580,485 L600,500"/>
    <circle class="dot" cx="600" cy="500" r="2"/>
    <text x="605" y="505" class="caption">rotatable</text>
  </g>

  <text x="340" y="580" text-anchor="middle" class="caption">手绘白板草图 · 仅用于概念沟通 · 非最终渲染</text>
</svg>